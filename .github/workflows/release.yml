name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    if: "contains(toLower(github.event.head_commit.message), 'release')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis gcc-mingw-w64
          pnpm --prefix frontend install

      - name: Build Windows Portable
        run: wails build -platform windows/amd64 -clean

      - name: Build Windows Installer
        run: wails build -platform windows/amd64 -nsis

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp build/bin/kube-simulator.exe dist/kube-simulator-portable.exe
          cp build/bin/kube-simulator-amd64-installer.exe dist/kube-simulator-installer.exe

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r '.info.productVersion' wails.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/kube-simulator-portable.exe
            dist/kube-simulator-installer.exe
          body: |
            Automated Release for version v${{ env.VERSION }}

            Commit: ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

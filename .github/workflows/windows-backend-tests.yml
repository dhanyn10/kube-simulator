name: Windows Backend Unit Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.x'
        cache: true
        cache-dependency-path: go.sum

    - name: Run Windows Backend Tests
      shell: bash
      env:
        CGO_ENABLED: '0'
      run: |
        mkdir -p frontend/dist
        echo "dummy" > frontend/dist/index.html
        go test ./... -v -coverprofile=coverage-backend-windows.out

    - name: Upload Windows Backend Coverage
      uses: actions/upload-artifact@v7
      with:
        name: windows-backend-coverage
        path: coverage-backend-windows.out

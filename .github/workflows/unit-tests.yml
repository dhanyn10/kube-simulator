name: Frontend Unit Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install pnpm globally via npm
      shell: bash
      run: npm install -g pnpm@10.30.3

    - name: Set up pnpm cache
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install

    - name: Run Unit tests
      shell: bash
      env:
        MSYS_NO_PATHCONV: '1'
      working-directory: frontend
      run: pnpm vitest run --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --coverage --coverage.reporter=lcov

    - name: Upload Frontend Coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-${{ matrix.shardIndex }}
        path: frontend/coverage/lcov.info

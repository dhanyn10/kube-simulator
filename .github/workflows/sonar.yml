name: SonarQube Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-windows-test:
    name: Backend Windows Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Run Windows Backend Tests
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p frontend/dist
          echo "dummy" > frontend/dist/index.html
          go test ./backend/... . -v -coverprofile=coverage-backend-windows.out

      - name: Upload Windows Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-backend-coverage-out
          path: coverage-backend-windows.out

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [backend-windows-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: windows-backend-coverage-out
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Run Backend Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p frontend/dist
          echo "dummy" > frontend/dist/index.html
          go test ./... -v -coverprofile=coverage-backend.out -json > report-backend.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          corepack enable pnpm
          pnpm install
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          (cd .. && mkdir -p frontend/dist && echo "dummy" > frontend/dist/index.html && $HOME/go/bin/wails build -s -platform windows/amd64 -nopackage)
          npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage
          mkdir -p ../coverage
          cp coverage/lcov.info ../coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

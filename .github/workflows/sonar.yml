name: SonarQube Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-windows-test:
    name: Backend Windows Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Run Windows Backend Tests
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p frontend/dist
          echo "dummy" > frontend/dist/index.html
          go test ./backend/... . -v -coverprofile=coverage-backend-windows.out -json > report-backend.json

      - name: Upload Windows Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-backend-coverage-out
          path: |
            coverage-backend-windows.out
            report-backend.json

  frontend-test-shard:
    name: Frontend Tests (Shard ${{ matrix.index }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Install Frontend Dependencies
        shell: bash
        working-directory: frontend
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Run Vitest Shard with Coverage
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        working-directory: frontend
        run: |
          pnpm exec vitest run --shard=${{ matrix.index }}/3 --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage-shard-${{ matrix.index }}

      - name: Upload Frontend Coverage Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ matrix.index }}
          path: frontend/coverage-shard-${{ matrix.index }}/lcov.info

  sonarqube:
    name: SonarQube Scan
    runs-on: windows-latest
    needs: [backend-windows-test, frontend-test-shard]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: windows-backend-coverage-out
          path: .

      - name: Download Frontend Coverage Shard 1
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-shard-1
          path: frontend/coverage-shard-1

      - name: Download Frontend Coverage Shard 2
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-shard-2
          path: frontend/coverage-shard-2

      - name: Download Frontend Coverage Shard 3
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-shard-3
          path: frontend/coverage-shard-3

      - name: Merge Frontend LCOV Coverage Files
        shell: bash
        run: |
          mkdir -p coverage
          cat frontend/coverage-shard-1/lcov.info frontend/coverage-shard-2/lcov.info frontend/coverage-shard-3/lcov.info > coverage/lcov.info
          cp coverage-backend-windows.out coverage-backend.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

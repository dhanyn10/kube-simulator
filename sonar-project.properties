sonar.projectKey=dhanyn10_kube-builder
sonar.organization=dhanyn10

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=kube-simulator
#sonar.projectVersion=1.0

# Path to source directories
sonar.sources=app.go,main.go,backend,frontend/src
sonar.tests=app_test.go,integration_test.go,backend,frontend/test,frontend/e2e
sonar.test.inclusions=**/*_test.go,frontend/test/**/*.test.ts,frontend/test/**/*.test.tsx,frontend/e2e/**/*.spec.ts
sonar.exclusions=**/*_test.go,frontend/test/**/*.test.ts,frontend/test/**/*.test.tsx,frontend/e2e/**/*.spec.ts,frontend/wailsjs/**,build/**,dist/**

# Backend Coverage (Go)
sonar.go.coverage.reportPaths=coverage-backend.out,coverage-backend-windows.out
sonar.go.tests.reportPaths=report-backend.json

# Frontend Coverage (TypeScript/Vitest)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Encoding
#sonar.sourceEncoding=UTF-8

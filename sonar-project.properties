# SonarQube Project Configuration
sonar.projectKey=dhanyn10_kube-builder
sonar.projectName=Kube Simulator
sonar.projectVersion=1.0.0

# Path to source directories
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/test
sonar.test.inclusions=**/*_test.go,frontend/test/**/*.test.ts
sonar.exclusions=**/*_test.go,frontend/test/**/*.test.ts,frontend/src/wailsjs/**

# Backend Coverage (Go)
sonar.go.coverage.reportPaths=coverage-backend.out
sonar.go.tests.reportPaths=report-backend.json

# Frontend Coverage (TypeScript/Vitest)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
